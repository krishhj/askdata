# Hard: CTEs, window functions, row multiplication traps or several steps
- id: h01
  difficulty: hard
  question: Among sellers with at least 100 reviewed orders, which 3 have the highest average review score?
  gold_sql: |
    WITH order_scores AS (
        SELECT order_id, AVG(review_score) AS score
        FROM order_reviews
        GROUP BY 1
    ),
    seller_orders AS (
        SELECT DISTINCT seller_id, order_id FROM order_items
    )
    SELECT so.seller_id
    FROM seller_orders so
    JOIN order_scores s ON s.order_id = so.order_id
    GROUP BY 1
    HAVING COUNT(*) >= 100
    ORDER BY AVG(s.score) DESC
    LIMIT 3
  ordered: true
  verified: true
- id: h02
  difficulty: hard
  question: What percentage of distinct customers came back and ordered again?
  gold_sql: |
    WITH per_person AS (
        SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS orders
        FROM customers c
        JOIN orders o ON o.customer_id = c.customer_id
        GROUP BY 1
    )
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE orders > 1) / COUNT(*), 2) AS repeat_pct
    FROM per_person
  ordered: false
  verified: true
- id: h03
  difficulty: hard
  question: For each year, which product category (in English) earned the most delivered revenue?
  gold_sql: |
    WITH yearly AS (
        SELECT EXTRACT(YEAR FROM o.order_purchase_timestamp)::int AS year,
               COALESCE(t.product_category_name_english, p.product_category_name) AS category,
               SUM(oi.price) AS revenue
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        LEFT JOIN category_translation t ON t.product_category_name = p.product_category_name
        WHERE o.order_status = 'delivered'
          AND p.product_category_name IS NOT NULL
        GROUP BY 1, 2
    ),
    ranked AS (
        SELECT year, category, RANK() OVER (PARTITION BY year ORDER BY revenue DESC) AS rnk
        FROM yearly
    )
    SELECT year, category FROM ranked WHERE rnk = 1
  ordered: false
  verified: true
- id: h04
  difficulty: hard
  question: >-
    For January to August 2018, what was the percentage change in delivered revenue
    compared with the previous month? Leave January empty.
  gold_sql: |
    WITH monthly AS (
        SELECT DATE_TRUNC('month', o.order_purchase_timestamp)::date AS month, SUM(oi.price) AS revenue
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.order_status = 'delivered'
          AND o.order_purchase_timestamp >= '2018-01-01'
          AND o.order_purchase_timestamp < '2018-09-01'
        GROUP BY 1
    )
    SELECT month,
           ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month), 2)
           AS change_pct
    FROM monthly
    ORDER BY month
  ordered: true
  verified: true
- id: h05
  difficulty: hard
  question: >-
    Among product categories with at least 500 delivered orders, which one has the highest
    percentage of late deliveries? Use the English name.
  gold_sql: |
    WITH order_categories AS (
        SELECT DISTINCT o.order_id,
               COALESCE(t.product_category_name_english, p.product_category_name) AS category,
               o.order_delivered_customer_date > o.order_estimated_delivery_date AS is_late
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN products p ON p.product_id = oi.product_id
        LEFT JOIN category_translation t ON t.product_category_name = p.product_category_name
        WHERE o.order_status = 'delivered'
          AND o.order_delivered_customer_date IS NOT NULL
          AND p.product_category_name IS NOT NULL
    )
    SELECT category
    FROM order_categories
    GROUP BY 1
    HAVING COUNT(*) >= 500
    ORDER BY AVG(CASE WHEN is_late THEN 1.0 ELSE 0.0 END) DESC
    LIMIT 1
  ordered: false
  verified: true
- id: h06
  difficulty: hard
  question: What is the average review score of orders that contain more than one item?
  gold_sql: |
    WITH multi_item AS (
        SELECT order_id FROM order_items GROUP BY 1 HAVING COUNT(*) > 1
    ),
    order_scores AS (
        SELECT order_id, AVG(review_score) AS score FROM order_reviews GROUP BY 1
    )
    SELECT ROUND(AVG(s.score), 2) AS avg_score
    FROM multi_item m
    JOIN order_scores s ON s.order_id = m.order_id
  ordered: false
  verified: true
- id: h07
  difficulty: hard
  question: Which 3 customer states pay the highest average freight per order?
  gold_sql: |
    WITH order_freight AS (
        SELECT o.order_id, c.customer_state, SUM(oi.freight_value) AS freight
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        JOIN customers c ON c.customer_id = o.customer_id
        GROUP BY 1, 2
    )
    SELECT customer_state
    FROM order_freight
    GROUP BY 1
    ORDER BY AVG(freight) DESC
    LIMIT 3
  ordered: true
  verified: true
- id: h08
  difficulty: hard
  question: What share of delivered revenue comes from the top 10 sellers by delivered revenue?
  gold_sql: |
    WITH seller_revenue AS (
        SELECT oi.seller_id, SUM(oi.price) AS revenue
        FROM order_items oi
        JOIN orders o ON o.order_id = oi.order_id
        WHERE o.order_status = 'delivered'
        GROUP BY 1
    ),
    top_sellers AS (
        SELECT revenue FROM seller_revenue ORDER BY revenue DESC LIMIT 10
    )
    SELECT ROUND(100.0 * (SELECT SUM(revenue) FROM top_sellers)
                 / (SELECT SUM(revenue) FROM seller_revenue), 2) AS top10_share_pct
  ordered: false
  verified: true
- id: h09
  difficulty: hard
  question: How many distinct customers placed orders in at least 3 different calendar months?
  gold_sql: |
    WITH months AS (
        SELECT c.customer_unique_id,
               COUNT(DISTINCT DATE_TRUNC('month', o.order_purchase_timestamp)) AS active_months
        FROM customers c
        JOIN orders o ON o.customer_id = c.customer_id
        GROUP BY 1
    )
    SELECT COUNT(*) AS customers FROM months WHERE active_months >= 3
  ordered: false
  verified: true
- id: h10
  difficulty: hard
  question: What was the running total of delivered revenue at the end of each month in 2017?
  gold_sql: |
    WITH monthly AS (
        SELECT DATE_TRUNC('month', o.order_purchase_timestamp)::date AS month, SUM(oi.price) AS revenue
        FROM orders o
        JOIN order_items oi ON oi.order_id = o.order_id
        WHERE o.order_status = 'delivered'
          AND o.order_purchase_timestamp >= '2017-01-01'
          AND o.order_purchase_timestamp < '2018-01-01'
        GROUP BY 1
    )
    SELECT month, ROUND(SUM(revenue) OVER (ORDER BY month), 2) AS cumulative_revenue
    FROM monthly
