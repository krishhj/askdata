  ordered: true
  verified: true
- id: h11
  difficulty: hard
  question: For orders paid with more than one payment type, what is the average total amount paid per order?
  gold_sql: |
    WITH order_payments_total AS (
        SELECT order_id, SUM(payment_value) AS paid
        FROM order_payments
        GROUP BY 1
        HAVING COUNT(DISTINCT payment_type) > 1
    )
