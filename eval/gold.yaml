# Gold questions for evaluation. Every gold_sql must be run and checked by hand,
# then marked verified: true. run_eval.py refuses to run while any entry is unverified.
# Gold queries return only the columns the question asks for; compare.py decides
# whether extra columns in a generated answer are allowed (see EVAL_ALLOW_EXTRA_COLUMNS).

