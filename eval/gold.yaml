  verified: true
- id: h12
  difficulty: hard
  question: >-
    Among product categories with at least 1000 reviewed orders, which 3 have the highest
    average review score? Use English names.
  gold_sql: |
    WITH order_scores AS (
        SELECT order_id, AVG(review_score) AS score FROM order_reviews GROUP BY 1
    ),
    order_categories AS (
        SELECT DISTINCT oi.order_id,
               COALESCE(t.product_category_name_english, p.product_category_name) AS category
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
        LEFT JOIN category_translation t ON t.product_category_name = p.product_category_name
        WHERE p.product_category_name IS NOT NULL
    )
    SELECT oc.category
    FROM order_categories oc
    JOIN order_scores s ON s.order_id = oc.order_id
    GROUP BY 1
    HAVING COUNT(*) >= 1000
    ORDER BY AVG(s.score) DESC
    LIMIT 3
  ordered: true
  verified: true
- id: h13
  difficulty: hard
  question: For customers with at least two orders, what is the average number of days between their first and second order?
  gold_sql: |
    WITH numbered AS (
        SELECT c.customer_unique_id,
               o.order_purchase_timestamp,
               ROW_NUMBER() OVER (PARTITION BY c.customer_unique_id ORDER BY o.order_purchase_timestamp) AS n
        FROM customers c
        JOIN orders o ON o.customer_id = c.customer_id
    ),
    gaps AS (
        SELECT f.customer_unique_id,
               EXTRACT(EPOCH FROM (s.order_purchase_timestamp - f.order_purchase_timestamp)) / 86400 AS days
        FROM numbered f
        JOIN numbered s ON s.customer_unique_id = f.customer_unique_id AND f.n = 1 AND s.n = 2
    )
    SELECT ROUND(AVG(days)::numeric, 2) AS avg_days FROM gaps
  ordered: false
  verified: true
- id: h14
  difficulty: hard
  question: For each month of 2018, what percentage of delivered orders arrived after the estimated date?
  gold_sql: |
    SELECT DATE_TRUNC('month', order_purchase_timestamp)::date AS month,
           ROUND(100.0 * COUNT(*) FILTER (WHERE order_delivered_customer_date > order_estimated_delivery_date)
                 / COUNT(*), 2) AS late_pct
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND order_purchase_timestamp >= '2018-01-01'
      AND order_purchase_timestamp < '2019-01-01'
    GROUP BY 1
    ORDER BY 1
  ordered: true
  verified: true
- id: h15
  difficulty: hard
  question: Which seller state earned the most delivered revenue from customers living in a different state?
  gold_sql: |
    SELECT s.seller_state
    FROM order_items oi
    JOIN sellers s ON s.seller_id = oi.seller_id
    JOIN orders o ON o.order_id = oi.order_id
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered'
      AND s.seller_state <> c.customer_state
    GROUP BY 1
    ORDER BY SUM(oi.price) DESC
    LIMIT 1
