# Medium: several joins, filters, grouping or a data trap
- id: m01
  difficulty: medium
  question: Of the orders placed in each month of 2018, how many were delivered?
  gold_sql: |
    SELECT DATE_TRUNC('month', order_purchase_timestamp)::date AS month, COUNT(*) AS orders
    FROM orders
    WHERE order_status = 'delivered'
      AND order_purchase_timestamp >= '2018-01-01'
      AND order_purchase_timestamp < '2019-01-01'
    GROUP BY 1
    ORDER BY 1
  ordered: true
  verified: true
- id: m02
  difficulty: medium
  question: Which 5 product categories have the highest average item price? Use English names.
  gold_sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name) AS category
    FROM order_items oi
    JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN category_translation t ON t.product_category_name = p.product_category_name
    WHERE p.product_category_name IS NOT NULL
    GROUP BY 1
    ORDER BY AVG(oi.price) DESC
    LIMIT 5
  ordered: true
  verified: true
- id: m03
  difficulty: medium
  question: How many orders did customers in each state place in 2018?
  gold_sql: |
    SELECT c.customer_state, COUNT(*) AS orders
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY 1
  ordered: false
  verified: true
- id: m04
  difficulty: medium
