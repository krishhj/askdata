- id: m15
  difficulty: medium
  question: How much revenue did delivered orders generate in the final 60 days of the data?
  gold_sql: |
    WITH latest AS (SELECT MAX(order_purchase_timestamp) AS max_ts FROM orders)
    SELECT ROUND(SUM(oi.price), 2) AS revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    CROSS JOIN latest
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp > latest.max_ts - INTERVAL '60 days'
